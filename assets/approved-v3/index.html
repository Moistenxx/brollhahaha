    <style>

      .tag.lime { background:var(--lime); } .tag.yellow { background:var(--yellow); } .tag.red { background:var(--red); color:var(--paper2); }

      .speech::after { content:""; position:absolute; left:42px; bottom:-25px; width:30px; height:30px; border-right:5px solid var(--ink); border-bottom:5px solid var(--ink); background:var(--paper2); transform:rotate(45deg); }
      .speech.red { background:var(--red); color:var(--paper2); } .speech.red::after { background:var(--red); }

      .magnifier { position:absolute; width:130px; height:130px; border:9px solid var(--red); border-radius:50%; background:#ffffff88; }
      .magnifier::after { content:""; position:absolute; right:-72px; bottom:-50px; width:86px; height:16px; border-radius:12px; background:var(--red); transform:rotate(45deg); }
      .question { display:grid; place-items:center; width:120px; height:120px; border:8px solid var(--ink); border-radius:50%; background:var(--lime); font-size:76px; font-weight:950; }
      .route { width:580px; height:150px; position:relative; }
      .route::before { content:""; position:absolute; left:36px; right:36px; top:72px; height:8px; background:var(--ink); }

      .route b { position:absolute; top:0; font-size:22px; } .route b:nth-of-type(1) { left:0; } .route b:nth-of-type(2) { left:214px; } .route b:nth-of-type(3) { right:0; }
